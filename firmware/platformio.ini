; AquaPulse ESP32 firmware (M11). Build: make firmware-build
;   home-node        a real ESP32 DevKit v1 with the parts in docs/hardware
;   home-node-wokwi  the same code for the Wokwi simulator (a knob makes the
;                    water flow, LEDs show the valve relays)
;   tank-node        the tank node: level sensor, sump switch, pump relay
;   tank-node-wokwi  the tank node in Wokwi (you set the level on the sensor)
; Versions are pinned so a build gives the same result next year.

[platformio]
default_envs = home-node, home-node-wokwi, tank-node, tank-node-wokwi

[env]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
; C++17, the same as the tests on your computer (the ESP32 tools default to C++11).
build_unflags = -std=gnu++11
build_flags = -std=gnu++17
; FR-15: zero warnings in our own code (libraries from the registry are not checked).
build_src_flags = -Wall -Wextra -Werror
lib_deps =
  256dpi/MQTT@2.5.2
  bblanchon/ArduinoJson@7.2.1
  paulstoffregen/OneWire@2.3.8
  milesburton/DallasTemperature@3.11.0

[env:home-node]
build_src_filter = +<home/> +<common/>

[env:home-node-wokwi]
build_src_filter = +<home/> +<common/>
; Wokwi's valve is two LEDs, with no "fully open/closed" wires.
build_flags = ${env.build_flags} -DAQUAPULSE_WOKWI -DVALVE_HAS_FEEDBACK=0

[env:tank-node]
build_src_filter = +<tank/> +<common/>

[env:tank-node-wokwi]
build_src_filter = +<tank/> +<common/>
build_flags = ${env.build_flags} -DAQUAPULSE_WOKWI
