# Dependabot opens pull requests when our dependencies have updates or security fixes.
# M12: every part of the project is covered (FR-74).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # Image versions pinned in docker-compose.yml (M1).
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly

  # Python packages of the simulator (M2), pinned in simulator/uv.lock.
  - package-ecosystem: uv
    directory: /simulator
    schedule:
      interval: weekly

  # Base image in simulator/Dockerfile (M2).
  # We stay on Python 3.12 (pinned in pyproject.toml), so only patch updates
  # like 3.12.13 -> 3.12.14 are offered, never 3.13 or 3.15.
  - package-ecosystem: docker
    directory: /simulator
    schedule:
      interval: weekly
    ignore:
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  # Python packages of the backend (M3), pinned in backend/uv.lock.
  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly

  # Base image in backend/Dockerfile (M3). Same Python rule as the simulator.
  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
    ignore:
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  # M8: the web app's packages (pnpm-lock.yaml) and its build image.
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    groups:
      web-minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: docker
    directory: /web
    schedule:
      interval: weekly

  # M9: the Android app's Dart packages (pubspec.lock).
  - package-ecosystem: pub
    directory: /mobile
    schedule:
      interval: weekly
