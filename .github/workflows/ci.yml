# ---------------------------------------------------------------
# CI: runs on every push and pull request.
# M0: file hygiene checks and a full-history secret scan.
# M1: start the Docker stack and run the smoke test.
# M2: simulator lint + unit tests, and live MQTT tests against the stack.
# M3: backend lint + tests against a real database (coverage >= 80%),
#     and the API checks in the stack smoke test.
# M5: certificates for TLS (make certs), broker access-rule tests, a TLS
#     scan (testssl.sh) and a full-restart test.
# M6: Pango for PDF bills, 100% branch coverage for the billing engine,
#     and the billing checks in the stack smoke test.
# ---------------------------------------------------------------
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    name: File hygiene (pre-commit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Run pre-commit on all files
        # gitleaks is skipped here because the job below scans the full history.
        env:
          SKIP: gitleaks
        run: |
          pip install pre-commit==4.0.1
          pre-commit run --all-files --show-diff-on-failure

  secrets:
    name: Secret scan (gitleaks, full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # whole history, so old commits are scanned too
      - name: Run gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.21.2 \
            git --config /repo/.gitleaks.toml --redact --verbose /repo

  simulator:
    name: Simulator lint + unit tests (M2)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: simulator
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "0.11.32"
      - name: Install exactly the locked versions
        run: uv sync --frozen
      - name: Lint (ruff)
        run: uv run ruff check . && uv run ruff format --check .
      - name: Unit + contract tests
        run: uv run pytest

  backend:
    name: Backend lint + API, ingestor and billing tests (M3 to M6)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "0.11.32"
      - name: Install exactly the locked versions
        working-directory: backend
        run: uv sync --frozen
      - name: Install Pango, used by WeasyPrint to draw PDF bills (M6)
        # libharfbuzz-subset0 makes the fonts in each PDF small, fast.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 fonts-dejavu-core
      - name: Lint (ruff)
        working-directory: backend
        run: uv run ruff check . && uv run ruff format --check .
      - name: Start the database and the TLS MQTT broker the tests use
        run: |
          make env
          make certs
          docker compose build migrate
          docker compose up -d --wait db mqtt
      - name: API, ingestor, security and migration tests (fails below 80% coverage)
        # Also fails if backend/openapi.json is out of date (fix: make openapi).
        working-directory: backend
        run: uv run pytest
      - name: Billing engine has 100% branch coverage (FR-34)
        working-directory: backend
        run: >-
          uv run pytest tests/billing/test_bill_calculation_engine.py -o addopts=""
          --cov=app.billing.engine --cov-branch --cov-fail-under=100
      - name: Show logs if something failed
        if: failure()
        run: docker compose logs --no-color --tail=100 db mqtt broker-auth
      - name: Stop and clean up
        if: always()
        run: docker compose down -v

  stack:
    name: Docker stack smoke + live MQTT + TLS tests (M1 to M6)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "0.11.32"
      - name: Create .env (random secrets) and certificates, like on a developer's machine
        run: |
          make env
          make certs
      - name: Validate docker-compose.yml
        run: docker compose config --quiet
      - name: Build our images, start the stack and wait until healthy
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Smoke test (database, MQTT over TLS, email, HTTPS, simulator, API, ingestor, devices, billing)
        run: make smoke
      - name: TLS check (port 1883 closed, TLS 1.3, testssl.sh finds nothing)
        run: make tls-check
      - name: Demo history (7 days to keep CI fast), loaded twice to prove nothing doubles
        run: |
          make demo-data DAYS=7 | tee first.txt
          make demo-data DAYS=7 | tee second.txt
          grep -q "labelled events" first.txt
          # One line per demo building (M6 added the KWD one): both must say 0.
          test "$(grep -c "Demo history: 0 readings stored" second.txt)" = 2
      - name: Live MQTT tests (Last Will, commands, broker restart ...)
        run: make sim-test-live
      - name: Restart test (all healthy again within 90 s, NFR-17)
        run: make restart-check
      - name: Show logs if something failed
        if: failure()
        run: docker compose logs --no-color --tail=200
      - name: Stop and clean up
        if: always()
        run: docker compose down -v
