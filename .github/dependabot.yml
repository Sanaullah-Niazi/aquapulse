# Dependabot opens pull requests when our dependencies have updates or security fixes.
# More ecosystems (pip, npm, pub) are added as those parts are built.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # Image versions pinned in docker-compose.yml (M1).
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly

  # Python packages of the simulator (M2), pinned in simulator/uv.lock.
  - package-ecosystem: uv
    directory: /simulator
    schedule:
      interval: weekly

  # Base image in simulator/Dockerfile (M2).
  - package-ecosystem: docker
    directory: /simulator
    schedule:
      interval: weekly
