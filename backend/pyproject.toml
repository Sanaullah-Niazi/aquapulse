# AquaPulse backend: the FastAPI API (M3), the MQTT ingestor (M4) and the worker (M6).
[project]
name = "aquapulse-backend"
version = "0.7.0"
description = "AquaPulse API, ingestor and worker: accounts, buildings, live readings, valve and pump control, billing"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
    "fastapi==0.162.0",            # web framework, Swagger UI at /api/docs
    "uvicorn==0.54.0",             # runs the API
    "sqlalchemy[asyncio]==2.1.6",  # database layer; always parameterised SQL (FR-72)
    "asyncpg==0.32.0",             # fast PostgreSQL driver
    "alembic==1.20.1",             # database migrations (versioned schema changes)
    "argon2-cffi==25.1.0",         # Argon2id password hashing (FR-68)
    "pyjwt[crypto]==2.15.1",       # signed access tokens with Ed25519 (FR-69)
    "pydantic-settings==2.16.2",   # settings from environment variables
    "email-validator==2.3.0",      # checks email addresses
    "prometheus-client==0.26.0",   # /metrics (FR-31)
    "python-multipart==0.0.32",    # reads the login form used by Swagger's Authorize button
    "aiomqtt==2.5.1",              # MQTT client: the ingestor talks to the devices (M4)
    "jsonschema==4.26.0",          # checks every device message against /contracts (FR-22)
    "websockets==17.3",            # lets uvicorn serve the live WebSocket (FR-25)
    "segno==1.6.6",                # QR codes with a new device's settings (M5, FR-14)
    "weasyprint==70.0",            # PDF bills from an HTML template (M6, FR-36)
    "jinja2==3.1.6",               # fills the bill template
    "stripe==16.0.1",              # online payment in Stripe TEST mode (M6, FR-39)
    "pyotp==2.9.0",                # two-factor login codes from any authenticator app (M8, FR-70)
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1",
    "pytest-cov==7.1.0",
    "httpx2==2.16.0",
    "ruff==0.17.3",
    "hypothesis==6.170.0",         # property tests for the bill engine (FR-34)
    "pypdf==6.21.2",               # reads the text back out of PDF bills (FR-36)
]

[tool.uv]
package = false  # an application, not a library: run with `uv run`

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "-q --cov=app --cov-report=term-missing:skip-covered --cov-fail-under=80"

[tool.coverage.run]
omit = [
    # command-line helpers, run by make
    "app/seed.py", "app/export_openapi.py", "app/watch.py", "app/valve.py", "app/bills.py",
    "app/ingest/__main__.py",
]
# SQLAlchemy's async layer runs our code inside greenlets; without this,
# coverage would miss every line after the first database call.
concurrency = ["greenlet", "thread"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S311"]  # test passwords are not secrets; random test data
