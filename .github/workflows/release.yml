# M9 (FR-41): build the Android APK and attach it to a GitHub Release.
#
# How to use it: push a tag that starts with "v", for example
#   git tag v0.9.0 && git push origin v0.9.0
# This makes (or updates) the release "v0.9.0" with app-release.apk on it.
#
# Push notifications are optional. If the repository has a secret named
# GOOGLE_SERVICES_JSON (the whole google-services.json file pasted in), the
# APK is built with it and can receive pushes. Without it the APK still
# works; only push is off. The file itself is never committed.
name: Release APK

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    name: Build the APK and attach it to the release
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: stable
          cache: true
      - name: Install exactly the locked packages
        run: flutter pub get --enforce-lockfile
      - name: Tests first (no broken release)
        run: flutter test
      - name: Add the Firebase settings if the secret exists
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            echo "Push notifications: on"
          else
            echo "Push notifications: off (no GOOGLE_SERVICES_JSON secret)"
          fi
      - name: Build the release APK
        run: flutter build apk --release
      - name: Name the APK after the version
        run: cp build/app/outputs/flutter-apk/app-release.apk "build/aquapulse-${GITHUB_REF_NAME}.apk"
      - name: Keep the APK on the run too
        uses: actions/upload-artifact@v7
        with:
          name: aquapulse-apk-${{ github.ref_name }}
          path: mobile/build/aquapulse-${{ github.ref_name }}.apk
      - name: Attach it to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: mobile/build/aquapulse-${{ github.ref_name }}.apk
          generate_release_notes: true
