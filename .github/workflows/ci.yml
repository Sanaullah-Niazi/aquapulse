# ---------------------------------------------------------------
# CI: runs on every push and pull request.
# M0 has two jobs: file hygiene checks and a full-history secret scan.
# Later milestones add jobs for tests, builds and security scans.
# ---------------------------------------------------------------
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    name: File hygiene (pre-commit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Run pre-commit on all files
        # gitleaks is skipped here because the job below scans the full history.
        env:
          SKIP: gitleaks
        run: |
          pip install pre-commit==4.0.1
          pre-commit run --all-files --show-diff-on-failure

  secrets:
    name: Secret scan (gitleaks, full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # whole history, so old commits are scanned too
      - name: Run gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.21.2 \
            git --config /repo/.gitleaks.toml --redact --verbose /repo

  stack:
    name: Docker stack smoke test (M1)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Create .env (random secrets, like on a developer's machine)
        run: make env
      - name: Validate docker-compose.yml
        run: docker compose config --quiet
      - name: Start the stack and wait until healthy
        run: docker compose up -d --wait --wait-timeout 300
      - name: Smoke test (database, MQTT, email, web)
        run: make smoke
      - name: Show logs if something failed
        if: failure()
        run: docker compose logs --no-color --tail=200
      - name: Stop and clean up
        if: always()
        run: docker compose down -v
