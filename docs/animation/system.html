<!doctype html>
<!--
  AquaPulse, the whole system in one moving picture (an illustration).
  The roof tank and the pump follow the real Wokwi run of the tank node
  firmware (docs/screenshots/hardware/tank-node-serial.txt): pump on at 15 %,
  off at 96 %, stays off in between (hysteresis), on again when low.
  render(t) draws the picture at t seconds; `make animation` turns it into
  docs/screenshots/animation/aquapulse-system.gif.
-->
<html>
<head>
<meta charset="utf-8">
<title>AquaPulse system</title>
<style>
  html, body { margin: 0; background: #ffffff; font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif; }
  svg { display: block; }
  .h { fill: #0b2540; font-weight: 800; }
  .t { fill: #1f2d3d; font-weight: 700; font-size: 13px; }
  .s { fill: #5b6b7c; font-size: 11px; }
  .w { fill: #ffffff; }
</style>
</head>
<body>
<svg id="pic" width="1200" height="675" viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dff1fb"/><stop offset="1" stop-color="#f7fbfe"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6cc4f0"/><stop offset="1" stop-color="#1f8fd1"/>
    </linearGradient>
    <linearGradient id="cloud" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1479b8"/><stop offset="1" stop-color="#0b4f7c"/>
    </linearGradient>
    <linearGradient id="soil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9cdb4"/><stop offset="1" stop-color="#c4b490"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0b2540" flood-opacity="0.18"/>
    </filter>
    <clipPath id="roofClip"><rect x="232" y="96" width="156" height="62" rx="10"/></clipPath>
    <clipPath id="sumpClip"><rect x="40" y="560" width="150" height="62" rx="10"/></clipPath>
    <clipPath id="ownerScreen"><rect x="0" y="0" width="150" height="250" rx="10"/></clipPath>
  </defs>

  <rect width="1200" height="675" fill="url(#sky)"/>
  <circle cx="560" cy="120" r="34" fill="#ffe08a" opacity="0.9"/>
  <!-- title -->
  <text x="32" y="46" class="h" font-size="26">AquaPulse</text>
  <text x="186" y="46" fill="#1479b8" font-size="20" font-weight="700">smart water for a whole building</text>
  <text x="32" y="68" class="s" font-size="12">Illustration. The roof tank and pump follow the real ESP32 firmware running in the Wokwi simulator.</text>

  <!-- ground -->
  <rect x="0" y="540" width="640" height="135" fill="url(#soil)"/>
  <rect x="0" y="536" width="640" height="6" fill="#8fbf6a"/>

  <!-- sump -->
  <rect x="40" y="560" width="150" height="62" rx="10" fill="#fff" stroke="#7b8794" stroke-width="2"/>
  <g clip-path="url(#sumpClip)"><rect x="40" y="574" width="150" height="48" fill="url(#water)"/></g>
  <text x="44" y="642" class="t">Underground sump</text>
  <text x="44" y="658" class="s">float switch: water there</text>

  <!-- pump -->
  <line x1="115" y1="560" x2="115" y2="530" stroke="#7b8794" stroke-width="7"/>
  <g transform="translate(115,505)" filter="url(#sh)">
    <circle r="26" fill="#fff" stroke="#7b8794" stroke-width="2"/>
    <g id="impeller">
      <path d="M0,-17 C6,-8 6,8 0,17 C-6,8 -6,-8 0,-17Z" fill="#1479b8"/>
      <path d="M-17,0 C-8,6 8,6 17,0 C8,-6 -8,-6 -17,0Z" fill="#1479b8"/>
    </g>
  </g>
  <g transform="translate(205,550)">
    <rect id="pumpTag" width="78" height="26" rx="13" fill="#e5e9ee"/>
    <circle id="pumpLed" cx="14" cy="13" r="5" fill="#9aa5b1"/>
    <text id="pumpWord" x="25" y="17" class="t" font-size="12">Pump off</text>
  </g>

  <!-- rising pipe -->
  <path id="upPipe" d="M115,479 L115,128 L232,128" fill="none" stroke="#9aa5b1" stroke-width="9" stroke-linejoin="round" stroke-linecap="round"/>
  <g id="upDots"></g>

  <!-- building -->
  <rect x="220" y="168" width="330" height="372" rx="6" fill="#fdfdfd" stroke="#c9d1d9" stroke-width="2" filter="url(#sh)"/>
  <rect x="220" y="168" width="330" height="10" fill="#c9d1d9"/>
  <!-- roof tank -->
  <rect x="226" y="158" width="168" height="10" fill="#7b8794"/>
  <rect x="232" y="96" width="156" height="62" rx="10" fill="#fff" stroke="#7b8794" stroke-width="2" filter="url(#sh)"/>
  <g clip-path="url(#roofClip)"><rect id="roofWater" x="232" y="140" width="156" height="18" fill="url(#water)"/></g>
  <text id="roofPct" x="310" y="134" text-anchor="middle" class="h" font-size="22">16%</text>
  <rect x="299" y="86" width="22" height="10" rx="2" fill="#1f2d3d"/>
  <g id="ping"></g>
  <text x="400" y="112" class="t">Roof tank</text>
  <text x="400" y="128" class="s">level sensor + ESP32</text>

  <!-- down pipe -->
  <path d="M262,168 L262,520" stroke="#9aa5b1" stroke-width="7" fill="none"/>
  <g id="homes"></g>

  <!-- cloud -->
  <g transform="translate(690,250)" filter="url(#sh)">
    <path d="M30,90 C0,90 0,52 28,48 C30,20 66,10 84,30 C100,6 146,14 146,46 C176,46 182,90 150,90 Z" fill="url(#cloud)"/>
    <text x="90" y="62" text-anchor="middle" class="w" font-size="16" font-weight="800">AquaPulse</text>
    <text x="90" y="80" text-anchor="middle" fill="#cfe8f7" font-size="10">secure MQTT · AI · bills</text>
  </g>
  <text x="604" y="236" class="s">every reading, encrypted</text>
  <g id="packets"></g>

  <!-- resident -->
  <g transform="translate(690,352)">
    <circle cx="40" cy="22" r="18" fill="#f2c7a5"/>
    <path d="M16,10 C18,-6 62,-6 64,12 C56,4 30,2 16,10Z" fill="#3b2a20"/>
    <path d="M6,110 C6,62 74,62 74,110 Z" fill="#2da44e"/>
    <g transform="translate(78,26)" filter="url(#sh)">
      <rect width="116" height="190" rx="14" fill="#1f2d3d"/>
      <rect x="6" y="12" width="104" height="166" rx="8" fill="#fff"/>
      <text x="13" y="30" class="t" font-size="10">My home</text>
      <text x="13" y="48" class="s" font-size="9">Used today</text>
      <text id="resToday" x="13" y="64" class="h" font-size="15">452 L</text>
      <text x="13" y="82" class="s" font-size="9">Water quality</text>
      <text x="13" y="97" fill="#1a7f37" font-size="12" font-weight="700">pH 7.1 · safe</text>
      <text x="13" y="115" class="s" font-size="9">Bill so far</text>
      <text id="resBill" x="13" y="130" class="h" font-size="13">Rs 1,114</text>
      <rect id="resTapBox" x="13" y="148" width="90" height="18" rx="9" fill="#e8f4fb"/>
      <text id="resTap" x="58" y="160" text-anchor="middle" fill="#1479b8" font-size="9" font-weight="700">tap closed</text>
    </g>
    <text x="0" y="132" class="t">Resident</text>
    <text x="0" y="148" class="s">own water,</text>
    <text x="0" y="162" class="s">quality, bills</text>
  </g>

  <!-- owner -->
  <g transform="translate(960,200)">
    <circle cx="40" cy="22" r="18" fill="#d9a17e"/>
    <path d="M18,14 C20,-4 60,-4 62,14 C52,8 28,8 18,14Z" fill="#1f2d3d"/>
    <path d="M6,110 C6,62 74,62 74,110 Z" fill="#1479b8"/>
    <g transform="translate(0,124)" filter="url(#sh)">
      <rect width="190" height="196" rx="12" fill="#1f2d3d"/>
      <rect x="7" y="10" width="176" height="176" rx="8" fill="#fff"/>
      <text x="16" y="28" class="t" font-size="11">Owner · Demo Tower</text>
      <text x="16" y="46" class="s" font-size="9">Roof tank</text>
      <rect x="16" y="52" width="110" height="12" rx="6" fill="#e5e9ee"/>
      <rect id="ownBar" x="16" y="52" width="18" height="12" rx="6" fill="#1f8fd1"/>
      <text id="ownPct" x="134" y="62" class="t" font-size="11">16%</text>
      <text x="16" y="82" class="s" font-size="9">Pump (auto)</text>
      <text id="ownPump" x="16" y="97" class="t" font-size="12">off</text>
      <text x="104" y="82" class="s" font-size="9">Homes using</text>
      <text id="ownUsing" x="104" y="97" class="t" font-size="12">0 of 10</text>
      <text x="16" y="116" class="s" font-size="9">Building, litres per minute</text>
      <polyline id="chart" fill="none" stroke="#1479b8" stroke-width="2" stroke-linejoin="round" points=""/>
    </g>
    <text x="86" y="40" class="t">Building owner</text>
    <text x="86" y="56" class="s">whole building,</text>
    <text x="86" y="70" class="s">tank, tariffs, bills</text>
  </g>

  <!-- caption -->
  <g transform="translate(660,600)">
    <rect width="512" height="54" rx="12" fill="#0b2540" opacity="0.92"/>
    <circle id="capDot" cx="22" cy="27" r="7" fill="#2da44e"/>
    <text id="caption" x="40" y="24" class="w" font-size="15" font-weight="700"></text>
    <text id="caption2" x="40" y="42" fill="#cfe8f7" font-size="11"></text>
  </g>
</svg>
<script>
const LOOP = 16; // seconds, then it repeats
const NS = "http://www.w3.org/2000/svg";
const el = (id) => document.getElementById(id);
function mk(tag, attrs, parent, text) {
  const e = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  if (text !== undefined) e.textContent = text;
  parent.appendChild(e);
  return e;
}
const lerp = (a, b, f) => a + (b - a) * Math.min(1, Math.max(0, f));
const ease = (f) => 0.5 - Math.cos(Math.PI * Math.min(1, Math.max(0, f))) / 2;

// The Wokwi run, step by step: level %, pump, caption.
function state(t) {
  if (t < 2) return { level: 15, pump: false, c: "Roof tank low: 15 %", c2: "The tank's ESP32 measures the water level every second." };
  if (t < 7.5) return { level: lerp(15, 96, ease((t - 2) / 5.5)), pump: true, c: "Pump ON by itself", c2: "Below 25 % and the sump has water: the ESP32 decides, even offline." };
  if (t < 9.5) return { level: 96, pump: false, c: "Pump OFF at 96 %", c2: "Full: it stops before the tank can overflow." };
  if (t < 13.5) return { level: lerp(96, 40, ease((t - 9.5) / 4)), pump: false, c: "Families use water, the pump waits", c2: "Between 25 % and 95 % nothing switches: no rapid on/off." };
  if (t < 14.5) return { level: lerp(40, 15, ease(t - 13.5)), pump: false, c: "Families use water, the pump waits", c2: "Between 25 % and 95 % nothing switches: no rapid on/off." };
  return { level: 15, pump: false, c: "Everyone sees it live", c2: "Residents see their own water and bill; the owner sees the building." };
}

const homes = [
  { y: 222, name: "Unit 01", open: [[2.5, 6], [10, 14]], hair: "#3b2a20", shirt: "#2da44e" },
  { y: 300, name: "Unit 02", open: [[9.5, 15]], hair: "#a0522d", shirt: "#d4556b" },
  { y: 378, name: "Unit 03", open: [[0.5, 3.5], [11, 14.5]], hair: "#1f2d3d", shirt: "#8250df" },
  { y: 456, name: "Unit 04", open: [[5, 8], [12, 15]], hair: "#c9a227", shirt: "#bf8700" },
];
const isOpen = (h, t) => h.open.some(([a, b]) => t >= a && t < b);
const usedBy = (h, t) => h.open.reduce((s, [a, b]) => s + Math.max(0, Math.min(t, b) - a), 0);

function person(g, x, y, hair, shirt, s = 1) {
  mk("path", { d: `M${x - 13 * s},${y + 30 * s} C${x - 13 * s},${y + 10 * s} ${x + 13 * s},${y + 10 * s} ${x + 13 * s},${y + 30 * s} Z`, fill: shirt }, g);
  mk("circle", { cx: x, cy: y, r: 8 * s, fill: "#f2c7a5" }, g);
  mk("path", { d: `M${x - 8 * s},${y - 2 * s} C${x - 7 * s},${y - 12 * s} ${x + 7 * s},${y - 12 * s} ${x + 8 * s},${y - 2 * s} C${x + 3 * s},${y - 6 * s} ${x - 3 * s},${y - 6 * s} ${x - 8 * s},${y - 2 * s}Z`, fill: hair }, g);
}

function render(t) {
  t = ((t % LOOP) + LOOP) % LOOP;
  const s = state(t);
  const h = (62 * s.level) / 100;
  el("roofWater").setAttribute("y", 158 - h - Math.sin(t * 6) * 0.8);
  el("roofWater").setAttribute("height", h + 2);
  el("roofPct").textContent = `${Math.round(s.level)}%`;
  el("roofPct").setAttribute("fill", s.level > 55 ? "#ffffff" : "#0b2540");

  el("impeller").setAttribute("transform", `rotate(${s.pump ? t * 540 : 0})`);
  el("pumpLed").setAttribute("fill", s.pump ? "#2da44e" : "#9aa5b1");
  el("pumpTag").setAttribute("fill", s.pump ? "#dafbe1" : "#e5e9ee");
  el("pumpWord").textContent = s.pump ? "Pump ON" : "Pump off";
  el("pumpWord").setAttribute("fill", s.pump ? "#1a7f37" : "#1f2d3d");

  const up = el("upDots");
  up.innerHTML = "";
  if (s.pump) {
    const path = el("upPipe");
    const len = path.getTotalLength();
    for (let i = 0; i < 12; i++) {
      const p = path.getPointAtLength((t * 170 + (i * len) / 12) % len);
      mk("circle", { cx: p.x, cy: p.y, r: 3.2, fill: "#e8f6fd" }, up);
    }
  }

  const ping = el("ping");
  ping.innerHTML = "";
  for (const off of [0, 0.5]) {
    const ph = (t * 1.6 + off) % 1;
    mk("path", { d: `M${300 - 12 - ph * 16},${100 + ph * 26} Q310,${108 + ph * 30} ${320 + 12 + ph * 16},${100 + ph * 26}`, fill: "none", stroke: "#1479b8", "stroke-width": 1.6, opacity: (1 - ph) * 0.9 }, ping);
  }

  const g = el("homes");
  g.innerHTML = "";
  for (const home of homes) {
    const open = isOpen(home, t);
    const y = home.y;
    mk("line", { x1: 262, y1: y + 20, x2: 300, y2: y + 20, stroke: "#9aa5b1", "stroke-width": 5 }, g);
    mk("rect", { x: 236, y: y - 30, width: 300, height: 66, rx: 8, fill: open ? "#eaf6fd" : "#f6f8fa", stroke: open ? "#9fd3f2" : "#e1e6eb" }, g);
    // window
    mk("rect", { x: 470, y: y - 20, width: 52, height: 34, rx: 4, fill: "#cfe8f7", stroke: "#9fb7c9" }, g);
    mk("line", { x1: 496, y1: y - 20, x2: 496, y2: y + 14, stroke: "#9fb7c9" }, g);
    // meter + valve
    mk("circle", { cx: 312, cy: y + 20, r: 10, fill: "#fff", stroke: "#5b6b7c", "stroke-width": 1.6 }, g);
    const a = open ? t * 10 : 0.6;
    mk("line", { x1: 312, y1: y + 20, x2: 312 + 7 * Math.cos(a), y2: y + 20 + 7 * Math.sin(a), stroke: "#1479b8", "stroke-width": 2 }, g);
    // tap and drops
    mk("path", { d: `M322,${y + 20} L350,${y + 20} L350,${y + 30}`, stroke: "#7b8794", "stroke-width": 4, fill: "none" }, g);
    if (open) {
      for (let i = 0; i < 3; i++) {
        const dy = ((t * 40 + i * 9) % 26);
        mk("circle", { cx: 350, cy: y + 34 + dy * 0.6, r: 2.2, fill: "#1f8fd1", opacity: 1 - dy / 26 }, g);
      }
    }
    person(g, 380, y - 8, home.hair, home.shirt, 1);
    mk("text", { x: 402, y: y - 8, class: "t", "font-size": 12 }, g, home.name);
    mk("text", { x: 402, y: y + 8, class: "s", "font-size": 10 }, g, open ? `${Math.round(18 + 5 * Math.sin(t))} L/min` : "tap closed");
    mk("text", { x: 402, y: y + 22, class: "s", "font-size": 9 }, g, `${(400 + Math.round(usedBy(home, t) * 9)).toLocaleString("en")} L today`);
    // reading to the cloud
    const ph = (t * 0.55 + y / 160) % 1;
    const px = lerp(536, 700, ph);
    const py = lerp(y, 310, ph) - Math.sin(ph * Math.PI) * 30;
    mk("rect", { x: px - 6, y: py - 4, width: 12, height: 8, rx: 2, fill: "#2da44e", opacity: ph < 0.92 ? 0.95 : 0 }, g);
  }

  const pk = el("packets");
  pk.innerHTML = "";
  const tp = (t * 0.6) % 1;
  mk("rect", { x: lerp(394, 710, tp) - 6, y: lerp(120, 285, tp) - Math.sin(tp * Math.PI) * 30 - 4, width: 12, height: 8, rx: 2, fill: "#2da44e" }, pk);
  for (const [x2, y2, off] of [[960, 300, 0], [790, 470, 0.5]]) {
    const ap = (t * 0.7 + off) % 1;
    mk("circle", { cx: lerp(840, x2, ap), cy: lerp(310, y2, ap), r: 5, fill: "#f0b429", opacity: ap < 0.9 ? 1 : 0 }, pk);
  }

  const using = homes.filter((hm) => isOpen(hm, t)).length;
  const r = homes[0];
  el("resToday").textContent = `${(400 + Math.round(usedBy(r, t) * 9)).toLocaleString("en")} L`;
  el("resBill").textContent = `Rs ${(1114 + usedBy(r, t) * 0.4).toFixed(0).replace(/\B(?=(\d{3})+(?!\d))/g, ",")}`;
  el("resTap").textContent = isOpen(r, t) ? "water running now" : "tap closed";
  el("resTapBox").setAttribute("fill", isOpen(r, t) ? "#d2ecfa" : "#f0f3f6");

  el("ownBar").setAttribute("width", Math.max(8, (110 * s.level) / 100));
  el("ownPct").textContent = `${Math.round(s.level)}%`;
  el("ownPump").textContent = s.pump ? "ON" : "off";
  el("ownPump").setAttribute("fill", s.pump ? "#1a7f37" : "#1f2d3d");
  el("ownUsing").textContent = `${using + 3} of 10`;
  const pts = [];
  for (let i = 0; i <= 50; i++) {
    const tt = t - 12 + (i * 12) / 50;
    const u = tt < 0 ? 3 : homes.filter((hm) => isOpen(hm, tt)).length + 3;
    pts.push(`${16 + i * 3.1},${180 - u * 7}`);
  }
  el("chart").setAttribute("points", pts.join(" "));

  el("caption").textContent = s.c;
  el("caption2").textContent = s.c2;
  el("capDot").setAttribute("fill", s.pump ? "#2da44e" : s.level > 90 ? "#1f8fd1" : "#f0b429");
}
window.render = render;
window.LOOP = LOOP;
render(0);
</script>
</body>
</html>
