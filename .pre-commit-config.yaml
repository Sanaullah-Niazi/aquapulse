# pre-commit runs these checks automatically every time you `git commit`.
# If a check fails, the commit is stopped so you can fix the problem first.
# Install once per clone:  pre-commit install
# Run on all files:        pre-commit run --all-files
repos:
  # General file hygiene checks.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: detect-private-key
      - id: mixed-line-ending
        args: [--fix=lf]

  # Secret scanner: blocks commits that contain passwords, API keys or tokens.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
