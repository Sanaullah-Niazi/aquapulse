# ---------------------------------------------------------------
# CI: runs on every push and pull request.
# M0: file hygiene checks and a full-history secret scan.
# M1: start the Docker stack and run the smoke test.
# M2: simulator lint + unit tests, and live MQTT tests against the stack.
# ---------------------------------------------------------------
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    name: File hygiene (pre-commit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Run pre-commit on all files
        # gitleaks is skipped here because the job below scans the full history.
        env:
          SKIP: gitleaks
        run: |
          pip install pre-commit==4.0.1
          pre-commit run --all-files --show-diff-on-failure

  secrets:
    name: Secret scan (gitleaks, full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # whole history, so old commits are scanned too
      - name: Run gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.21.2 \
            git --config /repo/.gitleaks.toml --redact --verbose /repo

  simulator:
    name: Simulator lint + unit tests (M2)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: simulator
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          version: "0.11.32"
      - name: Install exactly the locked versions
        run: uv sync --frozen
      - name: Lint (ruff)
        run: uv run ruff check . && uv run ruff format --check .
      - name: Unit + contract tests
        run: uv run pytest

  stack:
    name: Docker stack smoke + live MQTT tests (M1, M2)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          version: "0.11.32"
      - name: Create .env (random secrets, like on a developer's machine)
        run: make env
      - name: Validate docker-compose.yml
        run: docker compose config --quiet
      - name: Build our images, start the stack and wait until healthy
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Smoke test (database, MQTT, email, web, simulator)
        run: make smoke
      - name: Live MQTT tests (Last Will, commands, broker restart ...)
        run: make sim-test-live
      - name: Show logs if something failed
        if: failure()
        run: docker compose logs --no-color --tail=200
      - name: Stop and clean up
        if: always()
        run: docker compose down -v
