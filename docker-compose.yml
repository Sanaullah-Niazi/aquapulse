# ---------------------------------------------------------------
# AquaPulse: the whole system in one file.
#   Start:  make up      (= docker compose up -d --wait)
#   Stop:   make down
#   Check:  make smoke
#
# M1 added the four "infrastructure" services that everything builds on.
# M2 added our first own service: the simulator (digital twin).
# M3 added the API, plus `migrate`, a one-shot job that prepares the database
# before the API starts. M4 added the ingestor: MQTT in, database out.
# M5 locks everything down: MQTT only over TLS with a password per device
# (broker-auth keeps the broker's password list), and HTTPS through Caddy.
# M6 adds the worker: scheduled jobs such as the monthly bills.
#
# Security note: every port is published on 127.0.0.1 only, so nothing is
# reachable from other computers on your Wi-Fi. Certificates come from
# `make certs` (infra/certs, never committed). Image versions are pinned so
# everyone runs the same thing.
# ---------------------------------------------------------------
name: ${COMPOSE_PROJECT_NAME:-aquapulse}

# Settings shared by the API and the migrate job (a YAML "anchor", reused below).
x-backend-env: &backend-env
  POSTGRES_DB: ${POSTGRES_DB:-aquapulse}
  POSTGRES_USER: ${POSTGRES_USER:-aquapulse}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is missing. Run "make env" to create it.}
  APP_DB_PASSWORD: ${APP_DB_PASSWORD:?APP_DB_PASSWORD is missing. Run "make env" to add it.}
  JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is missing. Run "make env" to add it.}
  JWT_PREVIOUS_SECRETS: ${JWT_PREVIOUS_SECRETS:-}
  PUBLIC_URL: ${PUBLIC_URL:-https://localhost:8443}
  WEB_APP_URL: ${WEB_APP_URL:-}
  CORS_ORIGINS: ${CORS_ORIGINS:-https://localhost:8443}
  MQTT_HOST: mqtt
  MQTT_PORT: 8883
  MQTT_CA_FILE: /certs/ca.crt
  MQTT_PUBLIC_HOST: ${MQTT_PUBLIC_HOST:-localhost}

services:
  # --- broker-auth: keeps the broker's password list up to date (M5) ---
  # Writes "username:hash" lines (never plain passwords) for the server
  # accounts and every active device, into a volume the broker reads.
  broker-auth:
    image: aquapulse/backend:dev
    command: ["python", "-m", "app.brokerauth"]
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *backend-env
      MQTT_INGESTOR_PASSWORD: ${MQTT_INGESTOR_PASSWORD:?MQTT_INGESTOR_PASSWORD is missing. Run "make env".}
      MQTT_COMMANDER_PASSWORD: ${MQTT_COMMANDER_PASSWORD:?MQTT_COMMANDER_PASSWORD is missing. Run "make env".}
      MQTT_MONITOR_PASSWORD: ${MQTT_MONITOR_PASSWORD:?MQTT_MONITOR_PASSWORD is missing. Run "make env".}
      SIM_DEVICE_SECRET: ${SIM_DEVICE_SECRET:-}
      SIM_BUILDING: ${SIM_BUILDING:-b01}
      SIM_HOMES: ${SIM_HOMES:-10}
    volumes:
      - broker-auth:/broker-auth
    healthcheck:
      # Healthy = the password list has been written.
      test: ["CMD", "python", "-c", "import os; exit(0 if os.path.getsize('/broker-auth/passwd') else 1)"]
      interval: 5s
      timeout: 5s
      retries: 12

  # --- MQTT broker: the "post office" between devices and the server ---
  # TLS only (port 8883), a password for every account, and access rules
  # per topic (infra/mosquitto). There is no plain port 1883 any more.
  mqtt:
    image: eclipse-mosquitto:2.1.2-alpine
    restart: unless-stopped
    # start.sh starts Mosquitto and reloads it when the password list changes.
    entrypoint: ["/bin/sh", "/mosquitto/config/start.sh"]
    depends_on:
      broker-auth:
        condition: service_healthy
    ports:
      - "127.0.0.1:8883:8883" # MQTT over TLS (MQTTX on your Mac, see the M5 guide)
    environment:
      MQTT_MONITOR_PASSWORD: ${MQTT_MONITOR_PASSWORD:?MQTT_MONITOR_PASSWORD is missing. Run "make env".}
    volumes:
      - ./infra/mosquitto:/mosquitto/config:ro
      - ./infra/certs/server:/certs:ro # server certificate + key (make certs)
      - broker-auth:/broker-auth:ro
      - mqtt-data:/mosquitto/data
    healthcheck:
      # Healthy = a real TLS login (read-only monitor account) can read the
      # broker's own status topic, with the certificate checked against our CA.
      test:
        - CMD-SHELL
        - >-
          mosquitto_sub -h localhost -p 8883 --cafile /mosquitto/certs/ca.crt
          -u monitor -P "$$MQTT_MONITOR_PASSWORD" -t '$$SYS/broker/version' -C 1 -W 3 > /dev/null
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # --- Database: PostgreSQL 16 with the TimescaleDB time-series extension ---
  db:
    image: timescale/timescaledb:2.31.0-pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aquapulse}
      POSTGRES_USER: ${POSTGRES_USER:-aquapulse}
      # No default: the stack refuses to start without a password in .env.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is missing. Run "make env" to create it.}
      TZ: UTC
    ports:
      - "127.0.0.1:5432:5432" # so DBeaver on your Mac can connect
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./infra/db/init:/docker-entrypoint-initdb.d:ro # runs once, on the first start
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # --- Mailpit: a fake email inbox, so we can see alert emails locally ---
  mailpit:
    image: axllent/mailpit:v1.32.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025" # web inbox: http://localhost:8025
      - "127.0.0.1:1025:1025" # SMTP: the backend sends email here
    environment:
      MP_MAX_MESSAGES: 5000
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Caddy: the front door (web server / reverse proxy) ---
  # Serves the status page and the web app (/app/, M8) and forwards /api to
  # the API. Only over HTTPS (https://localhost:8443) since M5; plain
  # http://localhost:8080 redirects there.
  caddy:
    # M8: Caddy plus the built web app (web/Dockerfile builds it with Node).
    build:
      context: .
      dockerfile: web/Dockerfile
    image: aquapulse/caddy:dev
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80" # http://localhost:8080 -> redirects to HTTPS
      - "127.0.0.1:8443:443" # https://localhost:8443
    environment:
      HTTPS_PORT: 8443 # the port your browser uses, for the redirect
      HSTS_MAX_AGE: ${HSTS_MAX_AGE:-3600}
    volumes:
      # The whole folder, not just the file: Docker on macOS keeps showing a
      # container the old copy of a single mounted file after `git pull`.
      - ./infra/caddy:/etc/caddy:ro
      - ./infra/caddy/site:/srv:ro
      - ./infra/certs/server:/certs:ro # same certificate as the broker (make certs)
      - caddy-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Simulator: the digital twin (M2) ---
  # 10 virtual homes + 1 tank, each with its own MQTT connection (over TLS,
  # with its own password since M5), sending the same messages real ESP32
  # hardware will send (contracts/ folder).
  simulator:
    build:
      context: .
      dockerfile: simulator/Dockerfile
    image: aquapulse/simulator:dev
    restart: unless-stopped
    depends_on:
      mqtt:
        condition: service_healthy
    environment:
      MQTT_HOST: mqtt
      MQTT_PORT: 8883
      MQTT_CA_FILE: /certs/ca.crt
      SIM_DEVICE_SECRET: ${SIM_DEVICE_SECRET:?SIM_DEVICE_SECRET is missing. Run "make env".}
      SIM_HOMES: ${SIM_HOMES:-10}
      SIM_INTERVAL_S: ${SIM_INTERVAL_S:-10}
      SIM_SEED: ${SIM_SEED:-42}
      SIM_BUILDING: ${SIM_BUILDING:-b01}
      SIM_WEEKEND_DAYS: ${SIM_WEEKEND_DAYS:-sat,sun}
      SIM_TANK_CAPACITY_L: ${SIM_TANK_CAPACITY_L:-5000}
      SIM_TANK_START_PCT: ${SIM_TANK_START_PCT:-30}
      SIM_PUMP_LPM: ${SIM_PUMP_LPM:-60}
      DEMO_TIMEZONE: ${DEMO_TIMEZONE:-Asia/Karachi}
    ports:
      - "127.0.0.1:8090:8090" # control API + Swagger UI: http://localhost:8090/docs
    volumes:
      - sim-data:/data # the devices' "flash memory": litre counters survive restarts
      - ./infra/certs/public:/certs:ro # only the CA certificate, to check the broker
    healthcheck:
      # Healthy = the control API answers and every device that should be online
      # (not stopped, no "offline" scenario) is connected to MQTT.
      test:
        - CMD
        - python
        - -c
        - "import json,urllib.request as u; h=json.load(u.urlopen('http://127.0.0.1:8090/healthz', timeout=3)); exit(0 if h['healthy'] else 1)"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  # --- migrate: prepares the database, then exits (M3) ---
  # Creates the API's limited database role, applies new migrations and sets
  # permissions. Runs on every `make up`; when nothing is new it does nothing.
  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: aquapulse/backend:dev
    command: ["python", "-m", "app.migrate"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *backend-env

  # --- API: the FastAPI backend (M3) ---
  # Reached through Caddy: https://localhost:8443/api/docs (Swagger UI).
  # No port is published: the API is only reachable through Caddy, and
  # /metrics stays inside the Docker network (FR-31).
  api:
    image: aquapulse/backend:dev
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      mqtt:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    environment:
      <<: *backend-env
      # Online payment in Stripe TEST mode (M6, optional: empty = switched off).
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      # Only used by `make seed` (demo accounts); never by the API itself.
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
      DEMO_TIMEZONE: ${DEMO_TIMEZONE:-Asia/Karachi}
    volumes:
      # Only the CA certificate: readyz checks the broker's TLS with it, and new
      # devices get its fingerprint (FR-14). Never the CA's private key.
      - ./infra/certs/public:/certs:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/api/healthz', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  # --- Ingestor: the bridge between MQTT and the database (M4) ---
  # Checks and stores every device message, and sends valve/pump commands
  # that the API queued. The only server program that talks MQTT, with two
  # accounts: "ingestor" (read only) and "commander" (send commands only).
  ingestor:
    image: aquapulse/backend:dev
    command: ["python", "-m", "app.ingest"]
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      mqtt:
        condition: service_healthy
    environment:
      <<: *backend-env
      MQTT_INGESTOR_PASSWORD: ${MQTT_INGESTOR_PASSWORD:?MQTT_INGESTOR_PASSWORD is missing. Run "make env".}
      MQTT_COMMANDER_PASSWORD: ${MQTT_COMMANDER_PASSWORD:?MQTT_COMMANDER_PASSWORD is missing. Run "make env".}
    volumes:
      - ./infra/certs/public:/certs:ro
    healthcheck:
      # Healthy = connected to the broker (its own metric says so). Metrics
      # (port 9100) stay inside the Docker network.
      test:
        - CMD
        - python
        - -c
        - "import urllib.request as u; t=u.urlopen('http://127.0.0.1:9100/metrics', timeout=3).read().decode(); exit(0 if 'ingest_mqtt_connected 1.0' in t else 1)"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  # --- Worker: jobs on a schedule (M6) ---
  # Monthly bills on the 1st at 02:00 building time, and overdue bills.
  # Alerts and the AI jobs join it in later milestones.
  worker:
    image: aquapulse/backend:dev
    command: ["python", "-m", "app.worker"]
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      mailpit:
        condition: service_healthy
    environment:
      <<: *backend-env
    healthcheck:
      # Healthy = it finished a round in the last 3 minutes.
      test:
        - CMD
        - python
        - -c
        - "import os,time; exit(0 if time.time() - os.path.getmtime('/tmp/aquapulse-worker-alive') < 180 else 1)"
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 10s

# Named volumes keep data when containers are recreated.
# `make reset` deletes them (all data gone, fresh start).
volumes:
  broker-auth:
  mqtt-data:
  db-data:
  caddy-data:
  sim-data:
