# ---------------------------------------------------------------
# CI: runs on every push and pull request.
# M0: file hygiene checks and a full-history secret scan.
# M1: start the Docker stack and run the smoke test.
# M2: simulator lint + unit tests, and live MQTT tests against the stack.
# M3: backend lint + tests against a real database (coverage >= 80%),
#     and the API checks in the stack smoke test.
# M5: certificates for TLS (make certs), broker access-rule tests, a TLS
#     scan (testssl.sh) and a full-restart test.
# M6: Pango for PDF bills, 100% branch coverage for the billing engine,
#     and the billing checks in the stack smoke test.
# M8: web app type check, unit tests and build; browser tests (Playwright)
#     against the running stack.
# M9: Android app (Flutter): analyze, widget tests, and a release APK
#     you can download from the run's "Artifacts".
# ---------------------------------------------------------------
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    name: File hygiene (pre-commit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Run pre-commit on all files
        # gitleaks is skipped here because the job below scans the full history.
        env:
          SKIP: gitleaks
        run: |
          pip install pre-commit==4.0.1
          pre-commit run --all-files --show-diff-on-failure

  secrets:
    name: Secret scan (gitleaks, full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # whole history, so old commits are scanned too
      - name: Run gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.21.2 \
            git --config /repo/.gitleaks.toml --redact --verbose /repo

  simulator:
    name: Simulator lint + unit tests (M2)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: simulator
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "0.11.32"
      - name: Install exactly the locked versions
        run: uv sync --frozen
      - name: Lint (ruff)
        run: uv run ruff check . && uv run ruff format --check .
      - name: Unit + contract tests
        run: uv run pytest

  backend:
    name: Backend lint + API, ingestor, billing and alert tests (M3 to M7)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "0.11.32"
      - name: Install exactly the locked versions
        working-directory: backend
        run: uv sync --frozen
      - name: Install Pango, used by WeasyPrint to draw PDF bills (M6)
        # libharfbuzz-subset0 makes the fonts in each PDF small, fast.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 fonts-dejavu-core
      - name: Lint (ruff)
        working-directory: backend
        run: uv run ruff check . && uv run ruff format --check .
      - name: Start the database and the TLS MQTT broker the tests use
        run: |
          make env
          make certs
          docker compose build migrate
          docker compose up -d --wait db mqtt
      - name: API, ingestor, security and migration tests (fails below 80% coverage)
        # Also fails if backend/openapi.json is out of date (fix: make openapi).
        working-directory: backend
        run: uv run pytest
      - name: Billing engine has 100% branch coverage (FR-34)
        working-directory: backend
        run: >-
          uv run pytest tests/billing/test_bill_calculation_engine.py -o addopts=""
          --cov=app.billing.engine --cov-branch --cov-fail-under=100
      - name: Show logs if something failed
        if: failure()
        run: docker compose logs --no-color --tail=100 db mqtt broker-auth
      - name: Stop and clean up
        if: always()
        run: docker compose down -v

  web:
    name: Web app type check + unit tests + build (M8)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install exactly the locked versions (pnpm comes with Node's corepack)
        run: corepack enable && pnpm install --frozen-lockfile
      - name: Type check
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Build (what Caddy serves at /app/)
        run: pnpm build

  mobile:
    name: Android app analyze + widget tests + APK (M9)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: stable
          cache: true
      - name: Install exactly the locked packages
        run: flutter pub get --enforce-lockfile
      - name: Analyze (lint)
        run: flutter analyze
      - name: Widget tests
        run: flutter test
      - name: Build the release APK
        run: flutter build apk --release
      - name: Keep the APK (download it from this run's Artifacts)
        uses: actions/upload-artifact@v7
        with:
          name: aquapulse-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
      - name: Check the push wiring builds (a fake google-services.json, never committed)
        run: |
          cat > android/app/google-services.json <<'JSON'
          {
            "project_info": {"project_number": "1", "project_id": "aquapulse-ci", "storage_bucket": "aquapulse-ci.appspot.com"},
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:1:android:0000000000000000",
                "android_client_info": {"package_name": "io.github.sanaullahniazi.aquapulse"}
              },
              "api_key": [{"current_key": "ci-fake-key"}],
              "oauth_client": [],
              "services": {"appinvite_service": {"other_platform_oauth_client": []}}
            }],
            "configuration_version": "1"
          }
          JSON
          flutter build apk --release
          rm android/app/google-services.json

  stack:
    name: Docker stack smoke + browser + live MQTT + TLS tests (M1 to M8)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "0.11.32"
      - name: Create .env (random secrets) and certificates, like on a developer's machine
        run: |
          make env
          make certs
      - name: Validate docker-compose.yml
        run: docker compose config --quiet
      - name: Build our images, start the stack and wait until healthy
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Smoke test (database, MQTT over TLS, email, HTTPS, web app, simulator, API, ingestor, devices, billing, alerts)
        run: make smoke
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install the web app's test tools and Chromium
        working-directory: web
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
      - name: Browser tests (login, 2FA, valve, every resident screen, accessibility)
        run: make web-e2e
      - name: Keep the browser test report if they failed
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7
      - name: TLS check (port 1883 closed, TLS 1.3, testssl.sh finds nothing)
        run: make tls-check
      - name: Demo history (7 days to keep CI fast), loaded twice to prove nothing doubles
        run: |
          make demo-data DAYS=7 | tee first.txt
          make demo-data DAYS=7 | tee second.txt
          grep -q "labelled events" first.txt
          # One line per demo building (M6 added the KWD one): both must say 0.
          test "$(grep -c "Demo history: 0 readings stored" second.txt)" = 2
      - name: Live MQTT tests (Last Will, commands, broker restart ...)
        run: make sim-test-live
      - name: Restart test (all healthy again within 90 s, NFR-17)
        run: make restart-check
      - name: Show logs if something failed
        if: failure()
        run: docker compose logs --no-color --tail=200
      - name: Stop and clean up
        if: always()
        run: docker compose down -v
