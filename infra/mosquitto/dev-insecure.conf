# ---------------------------------------------------------------
# Mosquitto config: DEV-INSECURE (milestones M1 to M4 only)
#
# Plain MQTT on port 1883 with no passwords, so we can learn how MQTT
# works with as few moving parts as possible. Docker only publishes the
# port on 127.0.0.1, so other computers can't reach it.
#
# M5 replaces this file with a TLS-only config (port 8883), per-device
# passwords and access rules (SRS FR-11, FR-12). Never use this file on
# a server that is reachable from the internet.
# ---------------------------------------------------------------

listener 1883
allow_anonymous true

# Keep retained messages and queued QoS 1 messages across restarts.
persistence true
persistence_location /mosquitto/data/

# Reject oversized messages (our contract allows at most 2 KB; SRS FR-10).
max_packet_size 4096

# Log to the container output, so `make logs` shows it.
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
