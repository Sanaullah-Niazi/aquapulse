# ---------------------------------------------------------------
# Mosquitto config (M5): TLS only, a password for everyone, and
# access rules for every topic (SRS FR-11, FR-12).
#
# start.sh (in this folder) prepares the files mentioned below and
# reloads the password list whenever broker-auth changes it, so a new,
# rotated or revoked device takes effect in about a second, without
# restarting the broker (FR-14).
# ---------------------------------------------------------------

# Nobody gets in without a username and password.
allow_anonymous false
# username:hash lines, written by the broker-auth service (never plain passwords).
password_file /mosquitto/auth/passwd
# Who may read or write which topics (see acl in this folder).
acl_file /mosquitto/auth/acl

# The only door: MQTT over TLS on port 8883. There is no plain port 1883 any more.
listener 8883
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
cafile /mosquitto/certs/ca.crt
# TLS 1.2 is the oldest version we accept; clients that can do 1.3 get 1.3.
tls_version tlsv1.2
# For TLS 1.2, only modern ciphers (AES-GCM, ChaCha20) with forward secrecy;
# the ESP32 (mbedTLS) supports them. Old CBC ciphers are off (LUCKY13).
ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305
# Flood protection (threat T-15): limit connections, and kick clients that
# stay silent longer than they promised (keepalive is checked by the broker).
max_connections 1000
max_keepalive 120

# Keep retained messages and queued QoS 1 messages across restarts.
persistence true
persistence_location /mosquitto/data/

# Reject oversized messages (our contract allows at most 2 KB; SRS FR-10).
max_packet_size 4096

# Log to the container output, so `make logs` shows it.
# "subscribe" also logs refused publishes ("Denied PUBLISH"), so the access rules can be seen at work.
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
log_type subscribe
connection_messages true
